services:
  mongo:
    image: mongo:6.0
    container_name: genieacs-mongo
    restart: always
    environment:
      - MONGO_INITDB_DATABASE=genieacs
    volumes:
      - ./data/mongo:/data/db
    networks:
      - genieacs-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # CLIENT 1 (Instance 1: acs.euginemediagroup.site)
  # ============================================================================
  genieacs-cwmp:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-cwmp
    restart: always
    command: ["genieacs-cwmp"]
    ports:
      - "7547:7547"
    env_file:
      - genieacs.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  genieacs-nbi:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-nbi
    restart: always
    command: ["genieacs-nbi"]
    ports:
      - "7557:7557"
    env_file:
      - genieacs.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  genieacs-fs:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-fs
    restart: always
    command: ["genieacs-fs"]
    ports:
      - "7567:7567"
    env_file:
      - genieacs.env
    volumes:
      - ./data/fs:/var/lib/genieacs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  genieacs-ui:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-ui
    restart: always
    command: ["genieacs-ui"]
    ports:
      - "3000:3000"
    env_file:
      - genieacs.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  # ============================================================================
  # CLIENT 2 (Instance 2: acs2.euginemediagroup.site)
  # ============================================================================
  genieacs-cwmp-client2:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-cwmp-client2
    restart: always
    command: ["genieacs-cwmp"]
    ports:
      - "7548:7548"
    env_file:
      - genieacs-client2.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  genieacs-nbi-client2:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-nbi-client2
    restart: always
    command: ["genieacs-nbi"]
    ports:
      - "7558:7558"
    env_file:
      - genieacs-client2.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  genieacs-fs-client2:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-fs-client2
    restart: always
    command: ["genieacs-fs"]
    ports:
      - "7568:7568"
    env_file:
      - genieacs-client2.env
    volumes:
      - ./data/fs-client2:/var/lib/genieacs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

  genieacs-ui-client2:
    build: .
    image: project-redaman-genieacs:latest
    container_name: genieacs-ui-client2
    restart: always
    command: ["genieacs-ui"]
    ports:
      - "3001:3001"
    env_file:
      - genieacs-client2.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - genieacs-net

networks:
  genieacs-net:
    driver: bridge
